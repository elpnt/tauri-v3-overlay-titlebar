[package]
name = "tauri-v3-overlay-titlebar"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_v3_overlay_titlebar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.3", features = [] }
# tauri-build = { path = "/path/to/tauri/crates/tauri-build", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.4", features = [] }
tauri-runtime-cef = "3.0.0-alpha.4"
# tauri = { path = "/path/to/tauri/crates/tauri", features = [] }
# tauri-runtime-cef = { path = "/path/to/tauri/crates/tauri-runtime-cef" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
